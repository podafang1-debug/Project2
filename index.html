<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F7A14F">
    <title>启智训练台 · 个性化康复训练辅助平台</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="css/style.css?v=20260908b">
    <link rel="stylesheet" href="css/profile-agent.css">
    <link rel="stylesheet" href="css/rubric-alignment.css?v=20260908c">
    <link rel="stylesheet" href="css/curriculum-levels.css?v=20260909a">
</head>
<body>
<!-- 登录 -->
<div id="login">
  <div class="brand">
    <div class="logo" id="logoIcon"></div>
    <h1>启智训练台</h1>
    <p>面向智力障碍及有特殊认知支持需要儿童的个性化训练平台<br>账号身份和数据权限由机构服务统一验证</p>
  </div>
  <div class="account-login-card">
    <div class="login-role-list" aria-label="支持的账号角色">
      <span>儿童</span><span>家长</span><span>康复医疗专业人员</span><span>内容与机构管理员</span>
    </div>
    <div id="accountLoginForm">
      <h2>账号登录</h2>
      <div class="field"><label for="phoneInput">手机号码</label><input id="phoneInput" type="tel" inputmode="tel" maxlength="17" placeholder="请输入 11 位手机号码" autocomplete="username"></div>
      <div class="field"><label for="passwordInput">登录密码</label><input id="passwordInput" type="password" maxlength="72" placeholder="请输入登录密码" autocomplete="current-password"></div>
      <button class="login-btn" id="loginBtn">登录</button>
    </div>
    <div id="adminSetupForm" class="hidden">
      <h2>初始化系统管理员</h2>
      <p class="setup-copy">仅在系统没有任何账号时开放。创建后，其他账号均由管理员分配角色与权限。</p>
      <div class="field"><label for="setupName">管理员姓名</label><input id="setupName" maxlength="40" autocomplete="name"></div>
      <div class="field"><label for="setupPhone">手机号码</label><input id="setupPhone" type="tel" inputmode="tel" maxlength="17" autocomplete="username"></div>
      <div class="field"><label for="setupPassword">登录密码</label><input id="setupPassword" type="password" maxlength="72" placeholder="8–72 位，包含字母和数字" autocomplete="new-password"></div>
      <div class="field"><label for="setupPasswordConfirm">确认密码</label><input id="setupPasswordConfirm" type="password" maxlength="72" autocomplete="new-password"></div>
      <button class="login-btn" id="setupAdminBtn">创建首位管理员</button>
    </div>
    <div class="login-service-state" id="loginServiceState">正在连接机构服务…</div>
    <div class="err" id="loginErr" role="alert" aria-live="polite"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="main" class="hidden">
  <div class="topbar">
    <div class="title"><span class="dot" id="topDot"></span>启智训练台</div>
    <span class="role-badge" id="roleBadge"></span>
    <div class="top-actions">
      <button class="mini-btn" id="btnExport" title="导出备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>备份
      </button>
      <button class="mini-btn" id="btnImport" title="导入恢复">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9M7 14l5-5 5 5M5 3h14" stroke-linecap="round" stroke-linejoin="round"/></svg>恢复
      </button>
    </div>
  </div>

  <div id="accBanner" class="acc-banner hidden"></div>

  <div class="today" id="todayBox">
    <h2><span id="icToday"></span>今日训练任务</h2>
    <p class="hint">系统依据 AI 个性化方案自动排程；逾期任务已标红，点「开始」即进入对应训练。</p>
    <div id="todayList"></div>
  </div>

  <!-- 各 Tab 内容由 JS 渲染 -->
  <div id="tabContent"></div>
</div>

<!-- 底部导航 -->
<div class="tabbar hidden" id="tabbar">
  <button class="tab on" data-tab="archive"><span id="t1"></span>档案</button>
  <button class="tab" data-tab="train"><span id="t2"></span>训练</button>
  <button class="tab" data-tab="ai"><span id="t3"></span>AI方案</button>
  <button class="tab" data-tab="report"><span id="t4"></span>报表</button>
  <button class="tab" data-tab="setting"><span id="t5"></span>设置</button>
</div>

<!-- 通用弹窗 -->
<div class="mask hidden" id="mask"><div class="sheet" id="sheet"></div></div>
<!-- 训练弹窗 -->
<div class="mask hidden" id="trainMask"><div class="sheet" id="trainSheet" style="position:relative;"></div></div>
<!-- 反馈遮罩（位于训练弹窗内，见 #trainFb） -->
<!-- 提示 -->
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" class="hidden">

<!-- 按依赖顺序加载拆分后的业务模块 -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/children.js"></script>
  <script src="js/training.js"></script>
  <script src="js/assessment.js"></script>
  <script src="js/ai-view.js"></script>
  <script src="js/report.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/database.js"></script>
  <script src="js/enhanced.js"></script>
  <script src="js/backend-api.js"></script>
  <script src="js/admin-governance.js?v=20260909a"></script>
  <script src="js/profile-ai.js"></script>
  <script src="js/onboarding-assessment.js?v=20260907d"></script>
  <script src="js/assessment-framework.js"></script>
  <script src="js/rehabilitation-methods.js"></script>
  <script src="js/safety-governance.js?v=20260907c"></script>
  <script src="js/clinical-workflow.js"></script>
  <script src="js/ui-role-experience.js"></script>
  <script src="js/scanner-import.js"></script>
  <script src="js/profile-agent.js"></script>
  <script src="js/question-logic-v2.js?v=20260908a"></script>
  <script src="js/baseline-logic-v2.js?v=20260907d"></script>
  <script src="js/rubric-alignment.js?v=20260908c"></script>
  <script src="js/level-curriculum.js?v=20260909a"></script>
  <script src="js/bootstrap.js"></script>
</body>
</html>
